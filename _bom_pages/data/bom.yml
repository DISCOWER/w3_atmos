# Each product alternative can list multiple item links; use world when no EU/US-specific link is known.
# quantity: number of units per platform (number or text, e.g. "2 m"); leave empty if unknown.
categories:
  - Electronics
  - Mechanical
  - Pneumatics

configuration:
  - title: Base plates
    choices:
      - id: discower-base
        label: DISCOWER base plate
        model: /3D/1.%20Bottom%20Plate/1_f.glb
        default: true
  - title: Actuation plates
    choices:
      - id: discower-thruster
        label: DISCOWER thruster plate
        model: /3D/2.%20Middle%20Plate/2_d.glb
        default: true
      - id: discower-prop
        label: DISCOWER propeller plate
        model: /3D/2.1%20Middle%20Plate%20Propeller/2_1_a.glb
        default: false
  - title: Avionics plates
    choices:
      - id: discower-avionics
        label: DISCOWER avionics plate
        model: /3D/4.%20Top%20Plate/4_f.glb
        default: true
  - title: Shared items
    choices:
      - id: general
        label: General
        icon: "📦"
        default: true

